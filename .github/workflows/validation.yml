name: Synthetic DEM validation
on:
  pull_request:
  push:
    branches: ['codex/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install GDAL test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gdal python3-numpy python3-pil
      - name: EPSG probe (GDAL 3.8.4, apt)
        run: /usr/bin/python3 validation/epsg_probe.py
      - name: Unit tests
        run: PYTHONPATH=. /usr/bin/python3 -m unittest discover -s dem_map_sheets/tests -v
      - name: DEM selection and NoData fallback
        run: /usr/bin/python3 validation/validate_dem.py
      - name: Independent TerrainRGB PNG roundtrip
        run: /usr/bin/python3 validation/verify_terrainrgb.py "$PWD" "$PWD/validation/terrainrgb_results"
      - name: GDAL edge regressions (rotated rasters)
        run: PYTHONPATH=. /usr/bin/python3 -m unittest validation.test_gdal_edges -v
      - name: Preserve results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: synthetic-validation
          path: |
            validation/results/**/validation_results.json
            validation/terrainrgb_results/terrainrgb_results.json
          if-no-files-found: warn

  gdal310:
    # Support-floor verification: environment-pointcloud.yml requires
    # gdal>=3.10, so the suite also runs on GDAL 3.10 (conda-forge).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: dem-gdal310
          create-args: >-
            python=3.12
            gdal=3.10
            numpy
            pillow
          init-shell: bash
      - name: EPSG probe (GDAL 3.10)
        shell: bash -el {0}
        run: python validation/epsg_probe.py
      - name: Unit tests (GDAL 3.10)
        shell: bash -el {0}
        run: PYTHONPATH=. python -m unittest discover -s dem_map_sheets/tests
      - name: KD-5 tiny-raster check (GDAL 3.10)
        shell: bash -el {0}
        run: PYTHONPATH=. python -m unittest validation.known_defects.test_known_defects.KnownDefects.test_kd5_tiny_raster_finer_than_output_cell_does_not_hang

  real-pdal:
    # Real PDAL (conda-forge, environment-pointcloud.yml): the tests that
    # the mocked suites cannot vouch for (NoData point guard, interpolation
    # methods, LAS/LAZ reading, axis order). REAL_PDAL_PATH enables the
    # opt-in real-PDAL tests.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Checkout the pre-fix baseline (2849ef4) for the reproduction step
        uses: actions/checkout@v7
        with:
          ref: 2849ef4cd0c072c57d77b635bf68ef7d788a5a75
          path: baseline
          persist-credentials: false
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: dem-pointcloud
          environment-file: dem_map_sheets/environment-pointcloud.yml
          init-shell: bash
      - name: Versions
        shell: bash -el {0}
        run: |
          pdal --version
          python -c "from osgeo import gdal; print('GDAL', gdal.__version__)"
      - name: PDAL probe
        shell: bash -el {0}
        run: REAL_PDAL_PATH="$(which pdal)" python validation/pdal_probe.py
      - name: Unit tests with real PDAL (includes the opt-in real-PDAL tests)
        shell: bash -el {0}
        run: REAL_PDAL_PATH="$(which pdal)" PYTHONPATH=. python -m unittest discover -s dem_map_sheets/tests -v
      - name: Fixture generator for the Windows/QGIS verification (real PDAL)
        shell: bash -el {0}
        run: |
          python validation/make_nodata_fixtures.py --pdal "$(which pdal)" --out "$RUNNER_TEMP/nodata_fixtures"
          test "$(ls "$RUNNER_TEMP/nodata_fixtures" | wc -l)" -ge 16
      - name: Reproduce Issue #9 on the pre-fix baseline 2849ef4 (FAILURES ARE EXPECTED here)
        # Evidence only: the same real-PDAL tests run against the code before the
        # fix. Failing sub-tests show where the old code let a -9999 point
        # (IDW/mean) or a LAS -999999 point through. continue-on-error keeps
        # the job green; read this step's log, not its status.
        continue-on-error: true
        shell: bash -el {0}
        run: |
          cp dem_map_sheets/tests/test_real_pdal_nodata.py baseline/dem_map_sheets/tests/
          cd baseline
          REAL_PDAL_PATH="$(which pdal)" PYTHONPATH=. python -m unittest -v \
            dem_map_sheets.tests.test_real_pdal_nodata.CollisionStopTests 2>&1 || true

  plugin-zip:
    # Deterministic plugin ZIP for the hand-off (same commit -> same bytes).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build the plugin ZIP
        run: python3 validation/build_plugin_zip.py --commit HEAD --out "$RUNNER_TEMP/zip"
      - name: Upload the ZIP and its manifest
        uses: actions/upload-artifact@v7
        with:
          name: plugin-zip
          path: ${{ runner.temp }}/zip/*

